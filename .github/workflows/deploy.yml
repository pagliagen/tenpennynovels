name: Deploy to OVH VPS

on:
  pull_request:
    branches: [master, develop]
  push:
    branches: [master, develop]
  workflow_dispatch:
    inputs:
      skip_health_check:
        description: 'Skip health checks after deploy'
        required: false
        default: false
        type: boolean

jobs:
  build-check:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install all dependencies
        run: ./deploy/scripts/install-all.sh

      - name: Build all frontend apps
        run: npm run build:frontend:all

      - name: Build all backend services
        run: npm run build:backend:all

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-check
    # CRITICAL: deploy SOLO da master, anche per workflow_dispatch manuale.
    # develop esegue solo build-check (vedi 04-ci-cd.md).
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    # Use production environment
    environment:
      name: production
      url: https://tenpennynovels.com

    # Prevent concurrent deployments
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for git diff

      # Stamp YYYY-MM-DD of the deployed commit for landing sitemap lastmod (see SitemapService)
      - name: Write landing sitemap lastmod stamp
        run: |
          mkdir -p apps/landing/public
          git log -1 --format=%cs > apps/landing/public/landing-sitemap-lastmod.txt
          echo "landing-sitemap-lastmod: $(cat apps/landing/public/landing-sitemap-lastmod.txt)"

      - name: Deploy files via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete --exclude-from='.github/rsync-exclude.txt'
          path: ./
          remote_path: ~/tenpennynovels/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_port: ${{ secrets.SSH_PORT }}
          remote_user: ${{ secrets.SSH_USERNAME }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
          legacy_allow_rsa_hostkeys: true

      - name: Install dependencies
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/tenpennynovels

            # Load nvm and use correct Node version
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use

            # Detect changes by checksumming all package.json and package-lock.json files
            NEW_HASH=$(find . -maxdepth 3 -name 'package.json' -o -name 'package-lock.json' | sort | xargs cat | sha256sum | cut -d' ' -f1)
            OLD_HASH=""
            if [ -f .deps-hash ]; then
              OLD_HASH=$(cat .deps-hash)
            fi

            if [ "$NEW_HASH" != "$OLD_HASH" ]; then
              echo "📦 Dependency files changed — installing..."

              echo "📦 Installing frontend app dependencies..."
              for app in apps/*/; do
                if [ -f "${app}package.json" ]; then
                  echo "  → ${app}"
                  (cd "$app" && npm install)
                fi
              done

              echo "📦 Installing backend service dependencies..."
              for service in services/*/; do
                if [ -f "${service}package.json" ]; then
                  echo "  → ${service}"
                  (cd "$service" && npm install)
                fi
              done

              echo "$NEW_HASH" > .deps-hash
              echo "✅ Dependencies installed"
            else
              echo "⏭️  Skipping dependency installation (no changes)"
            fi

      - name: Build frontend apps
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd ~/tenpennynovels

            # Load nvm and use correct Node version
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use

            echo "🏗️  Building frontend apps..."
            echo "Node version: $(node --version)"
            echo "npm version: $(npm --version)"
            npm run build:frontend:all
            echo "✅ Frontend apps built successfully"

      - name: Build backend services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd ~/tenpennynovels

            # Load nvm and use correct Node version
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use

            # Backend build needs devDependencies (tsc, etc.); (re)install before build
            echo "📦 Ensuring backend devDependencies (for tsc/build)..."
            for service in services/api-gateway services/unified-backend services/embeddings-worker; do
              if [ -f "${service}/package.json" ]; then
                echo "  → ${service}"
                (cd "$service" && npm install)
              fi
            done
            if [ -f "services/unified-backend/src/shared/package.json" ]; then
              (cd "services/unified-backend/src/shared" && npm install)
            fi

            echo "🏗️  Building backend services..."
            echo "Node version: $(node --version)"
            echo "npm version: $(npm --version)"
            npm run build:backend:all
            echo "✅ Backend services built successfully"

      - name: Cleanup development dependencies
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/tenpennynovels

            echo "🗑️  Removing development dependencies from production..."

            for app in apps/*/; do
              if [ -f "${app}package.json" ]; then
                (cd "$app" && npm prune --production 2>/dev/null || true)
              fi
            done

            for service in services/*/; do
              if [ -f "${service}package.json" ]; then
                (cd "$service" && npm prune --production 2>/dev/null || true)
              fi
            done

            echo "✅ Development dependencies removed"

      - name: Setup Python for embeddings worker
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd ~/tenpennynovels/services/embeddings-worker/python

            echo "🐍 Installing Python dependencies for embeddings worker..."

            # Set HuggingFace token (avoids rate limits)
            export HUGGINGFACE_TOKEN="${{ secrets.HUGGINGFACE_TOKEN }}"

            # Install/update dependencies globally (no venv needed for PM2)
            rm -rf .venv
            python3 -m venv venv
            source venv/bin/activate
            pip3 install --upgrade pip
            pip3 install -r requirements.txt

            # Pre-download all models (embedding + moderation) using setup script
            echo "📦 Pre-downloading HuggingFace models (embedding + moderation)..."
            if python3 setup-models.py; then
              echo "✅ All models pre-downloaded successfully"
            else
              echo "⚠️  Model pre-download failed (likely rate-limited), will be downloaded on first use"
            fi

            echo "✅ Python embeddings worker ready"

      - name: Restart PM2 services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/tenpennynovels

            # Load nvm and use correct Node version
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use

            echo "🔄 Restarting PM2 services..."
            pm2 startOrRestart ecosystem.config.js --update-env --env production
            echo "✅ PM2 services restarted"

      - name: Verify PM2 status
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/tenpennynovels

            # Load nvm and use correct Node version
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use

            echo "⏳ Waiting for services to stabilize..."
            sleep 5
            echo ""
            echo "✅ PM2 Status:"
            pm2 status --no-color

      - name: Health checks
        if: ${{ github.event.inputs.skip_health_check != 'true' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            set -e

            # Give unified-backend (ws) time to bind and connect to MongoDB/Redis
            echo "⏳ Waiting 15s for services to be ready..."
            sleep 15

            echo "🏥 Running health checks..."
            echo ""

            # API Gateway
            echo "Checking https://api.tenpennynovels.com/health..."
            api_code=$(curl -s -o /dev/null -w "%{http_code}" "https://api.tenpennynovels.com/health" --max-time 10)
            if [ "$api_code" -eq 200 ]; then
              echo "✅ api.tenpennynovels.com OK ($api_code)"
            else
              echo "❌ api.tenpennynovels.com FAILED ($api_code)"
              exit 1
            fi
            echo ""

            # WebSocket (unified-backend) - retry: può impiegare più tempo ad avviarsi
            echo "Checking https://ws.tenpennynovels.com/health..."
            ws_ok=0
            for attempt in 1 2 3 4 5; do
              ws_code=$(curl -s -o /dev/null -w "%{http_code}" "https://ws.tenpennynovels.com/health" --max-time 10)
              if [ "$ws_code" -eq 200 ]; then
                echo "✅ ws.tenpennynovels.com OK ($ws_code) (attempt $attempt)"
                ws_ok=1
                break
              fi
              echo "  Attempt $attempt: $ws_code, retrying in 5s..."
              sleep 5
            done
            if [ "$ws_ok" -eq 0 ]; then
              echo "❌ ws.tenpennynovels.com FAILED after 5 attempts"
              exit 1
            fi

            echo ""
            echo "✅ All health checks passed!"

      - name: Deployment summary
        if: success()
        run: |
          echo "## 🚀 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: Production (OVH VPS)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Services Deployed" >> $GITHUB_STEP_SUMMARY
          echo "- Landing App: https://tenpennynovels.com" >> $GITHUB_STEP_SUMMARY
          echo "- Game App: https://game.tenpennynovels.com" >> $GITHUB_STEP_SUMMARY
          echo "- Documents App: https://documenti.tenpennynovels.com" >> $GITHUB_STEP_SUMMARY
          echo "- Management App: https://gestione.tenpennynovels.com" >> $GITHUB_STEP_SUMMARY
          echo "- API Gateway: https://api.tenpennynovels.com" >> $GITHUB_STEP_SUMMARY
          echo "- WebSocket Server: https://ws.tenpennynovels.com" >> $GITHUB_STEP_SUMMARY

      - name: Deployment failure summary
        if: failure()
        run: |
          echo "## ❌ Deployment Failed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Check the logs above for error details" >> $GITHUB_STEP_SUMMARY
          echo "2. SSH into the server to investigate: \`ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}\`" >> $GITHUB_STEP_SUMMARY
          echo "3. Check PM2 status: \`pm2 status\`" >> $GITHUB_STEP_SUMMARY
          echo "4. Check PM2 logs: \`pm2 logs --lines 50\`" >> $GITHUB_STEP_SUMMARY
          echo "5. If needed, revert to previous commit and re-deploy" >> $GITHUB_STEP_SUMMARY
