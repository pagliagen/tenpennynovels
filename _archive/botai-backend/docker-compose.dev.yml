# BotAI Backend - DEVELOPMENT Configuration
# Docker Compose per l'istanza di development
# Porta: 8082 | Database: botai-dev | Hot-reload: tsx watch

services:
  # MongoDB dedicato per Development
  botai-mongodb-dev:
    image: mongo:6.0
    container_name: botai-mongodb-dev
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGODB_ROOT_DATABASE:-botai-dev}
    ports:
      - "27020:27017"  # Porta 27020 per accesso diretto esterno
    volumes:
      - botai_dev_mongodb_data:/data/db
    networks:
      - botai-dev-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # BotAI Backend Service - Development
  botai-backend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev  # Dockerfile per development con hot-reload
    image: botai-backend-dev:latest
    container_name: botai-backend-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 8080  # Interno al container

      # MongoDB Development Database
      MONGODB_URI: mongodb://${MONGODB_ROOT_USERNAME}:${MONGODB_ROOT_PASSWORD}@botai-mongodb-dev:27017/${MONGODB_ROOT_DATABASE}?authSource=admin

      # Embeddings Service (shared - avvia con docker-compose.embeddings.yml)
      EMBEDDINGS_SERVICE_URL: http://host.docker.internal:5002

      # Game Backend Integration
      GAME_BACKEND_URL: ${GAME_BACKEND_URL}
      GAME_BACKEND_BOT_API_KEY: ${GAME_BACKEND_BOT_API_KEY}

      # Admin Backend Integration (per uso futuro con management-backend)
      ADMIN_BACKEND_URL: ${ADMIN_BACKEND_URL}
      ADMIN_BACKEND_BOT_API_KEY: ${ADMIN_BACKEND_BOT_API_KEY}

      # Claude API
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-haiku-4-5-20251001}
      TRANSLATION_MODEL: ${TRANSLATION_MODEL:-claude-sonnet-4-5-20250929}
    ports:
      - "8082:8080"  # Mappa porta 8082 esterna -> 8080 interna
    depends_on:
      botai-mongodb-dev:
        condition: service_healthy
    networks:
      - botai-dev-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 300s
      timeout: 10s
      retries: 3
      start_period: 300s
    volumes:
      # Mount source code per hot-reload
      - ./src:/app/src
      - ./tsconfig.json:/app/tsconfig.json
      - ./logs:/app/logs
      # Exclude node_modules (use container's version)
      - /app/node_modules

volumes:
  botai_dev_mongodb_data:
    name: botai_dev_mongodb_data
    driver: local

networks:
  botai-dev-network:
    name: botai_dev_network
    driver: bridge
