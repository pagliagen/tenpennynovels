# BotAI Backend - PRODUCTION Configuration
# Docker Compose per l'istanza di produzione
# Porta: 8080 | Database: botai-prod | Build: compilato

services:
  # MongoDB dedicato per Production
  botai-mongodb-prod:
    image: mongo:6.0
    container_name: botai-mongodb-prod
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGODB_ROOT_DATABASE:-botai-prod}
    ports:
      - "27019:27017"  # Porta 27019 per accesso diretto esterno
    volumes:
      - botai_prod_mongodb_data:/data/db
    networks:
      - botai-prod-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # BotAI Backend Service - Production
  botai-backend-prod:
    build:
      context: .
      dockerfile: Dockerfile  # Multi-stage build production
    image: botai-backend-prod:latest
    container_name: botai-backend-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080

      # MongoDB Production Database
      MONGODB_URI: mongodb://${MONGODB_ROOT_USERNAME}:${MONGODB_ROOT_PASSWORD}@botai-mongodb-prod:27017/${MONGODB_ROOT_DATABASE}?authSource=admin

      # Embeddings Service (shared - avvia con docker-compose.embeddings.yml)
      EMBEDDINGS_SERVICE_URL: http://host.docker.internal:5002

      # Game Backend Integration
      GAME_BACKEND_URL: ${GAME_BACKEND_URL}
      GAME_BACKEND_BOT_API_KEY: ${GAME_BACKEND_BOT_API_KEY}

      # Admin Backend Integration (per uso futuro con management-backend)
      ADMIN_BACKEND_URL: ${ADMIN_BACKEND_URL}
      ADMIN_BACKEND_BOT_API_KEY: ${ADMIN_BACKEND_BOT_API_KEY}

      # Claude API
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-haiku-4-5-20251001}
      TRANSLATION_MODEL: ${TRANSLATION_MODEL:-claude-sonnet-4-5-20250929}
    ports:
      - "8080:8080"  # Porta production
    depends_on:
      botai-mongodb-prod:
        condition: service_healthy
    networks:
      - botai-prod-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      - ./logs:/app/logs  # Mount logs directory

volumes:
  botai_prod_mongodb_data:
    name: botai_prod_mongodb_data
    driver: local

networks:
  botai-prod-network:
    name: botai_prod_network
    driver: bridge
