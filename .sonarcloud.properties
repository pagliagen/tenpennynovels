# Configurazione di SonarCloud Automatic Analysis (autoscan).
# NB: l'autoscan NON legge sonar-project.properties — solo questo file, e solo
# sul branch di default.

# Versioni Python target: il container di embeddings-worker è python:3.12-slim,
# l'host di deploy usa il python3 di sistema (3.11 su Debian 12). Dichiararle
# rende l'analisi Python precisa ed elimina il warning "compatible with all
# Python 3 versions by default".
sonar.python.version=3.11, 3.12

# local-ai/ e local-tools/ non vanno in produzione: sono tooling locale (bot AI
# di sviluppo, generazione immagini). Fuori dallo scope dell'analisi.
sonar.exclusions=local-ai/**, local-tools/**
