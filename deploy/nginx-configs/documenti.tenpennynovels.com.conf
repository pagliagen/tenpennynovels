# TenPennyNovels - documenti Frontend
# Domain: documenti.tenpennynovels.com
# Proxy to: localhost:4002
#
# NOTE: This config contains only HTTP (port 80).
# After running 'sudo certbot --nginx -d documenti.tenpennynovels.com', certbot will:
# - Generate SSL certificates
# - Add HTTPS (port 443) configuration automatically
# - Add HTTP to HTTPS redirect

server {
    server_name documenti.tenpennynovels.com;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    # Sitemap (generated by backend cron)
    location ~ ^/sitemap.*\.xml$ {
        proxy_pass http://127.0.0.1:4002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Content-Type "application/xml; charset=UTF-8";
        add_header Cache-Control "public, max-age=3600";
    }

    # Next.js Static Assets (1 year cache)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:4002;
        proxy_http_version 1.1;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, immutable, max-age=31536000";
        access_log off;
    }

    # Next.js Image Optimization
    location /_next/image {
        proxy_pass http://127.0.0.1:4002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public Assets
    location /public/ {
        proxy_pass http://127.0.0.1:4002;
        proxy_http_version 1.1;
        add_header Cache-Control "public, max-age=3600";
    }

    # Main Application
    location / {
        proxy_pass http://127.0.0.1:4002;
        proxy_http_version 1.1;

        # Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/documenti.tenpennynovels.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/documenti.tenpennynovels.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = documenti.tenpennynovels.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name documenti.tenpennynovels.com;
    return 404; # managed by Certbot


}
