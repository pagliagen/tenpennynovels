# ========================================
# TenPennyNovels - API Gateway
# api.tenpennynovels.com → localhost:8000
# ========================================

# HTTP (redirect to HTTPS)
server {
    listen 80;
    listen [::]:80;
    server_name api.tenpennynovels.com;

    # Redirect all HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.tenpennynovels.com;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/api.tenpennynovels.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.tenpennynovels.com/privkey.pem;

    # SSL Security (Mozilla Intermediate configuration)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # NOTE: CORS è gestito dall'api-gateway (allowlist in codice), non da Nginx.

    # Logging
    access_log /var/log/nginx/api-tenpennynovels-access.log;
    error_log /var/log/nginx/api-tenpennynovels-error.log;

    # Client body size (for file uploads)
    client_max_body_size 10M;

    # NOTE: Rate limiting can be added in /etc/nginx/nginx.conf http block if needed:
    # limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;

    # Proxy to API Gateway (PM2 on port 8000)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Timeouts: gateway usa documentsTimeout 120s per /documents (es. ricerche lunghe / SSE).
        # Nginx deve essere >= al backend/gateway altrimenti 504 prima del timeout applicativo.
        proxy_connect_timeout 75s;
        proxy_send_timeout 130s;
        proxy_read_timeout 130s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # Health check endpoint (no rate limit)
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}
