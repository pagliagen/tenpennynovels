version: '3.8'

services:
  # MongoDB Database
  tenpennynovels-mongodb:
    image: mongo:6.0
    container_name: tenpennynovels-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: tenpennynovels
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./config/mongodb/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - tenpennynovels-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis Cache & Message Broker
  tenpennynovels-redis:
    image: redis:7-alpine
    container_name: tenpennynovels-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass redis123
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - tenpennynovels-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 3s
      retries: 5


  # Redis Commander (Web UI for Redis)
  tenpennynovels-redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: tenpennynovels-redis-commander
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:tenpennynovels-redis:6379:0:redis123
    ports:
      - "8081:8081"
    depends_on:
      - tenpennynovels-redis
    networks:
      - tenpennynovels-network

  # MongoDB Express (Web UI for MongoDB)
  tenpennynovels-mongo-express:
    image: mongo-express:latest
    container_name: tenpennynovels-mongo-express
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password123
      ME_CONFIG_MONGODB_URL: mongodb://@tenpennynovels-mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    ports:
      - "8082:8081"
    depends_on:
      tenpennynovels-mongodb:
        condition: service_healthy
    networks:
      - tenpennynovels-network

  # Embeddings Microservice (Semantic Search)
  tenpennynovels-embeddings:
    build:
      context: ./services/embeddings-service
      dockerfile: Dockerfile
    image: tenpennynovels/embeddings-service:latest
    container_name: tenpennynovels-embeddings
    restart: unless-stopped
    environment:
      EMBEDDINGS_SERVICE_HOST: 0.0.0.0
      EMBEDDINGS_SERVICE_PORT: 5001
      EMBEDDINGS_MODEL: paraphrase-multilingual-MiniLM-L12-v2
      LOG_LEVEL: INFO
    ports:
      - "5001:5001"
    networks:
      - tenpennynovels-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Embeddings Worker (Async Processing)
  tenpennynovels-embeddings-worker:
    build:
      context: .
      dockerfile: ./services/embeddings-worker/Dockerfile
    image: tenpennynovels/embeddings-worker:latest
    container_name: tenpennynovels-embeddings-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://@tenpennynovels-mongodb:27017/tenpennynovels
      REDIS_URL: redis://:redis123@tenpennynovels-redis:6379
      EMBEDDINGS_SERVICE_URL: http://tenpennynovels-embeddings:5001
    depends_on:
      tenpennynovels-mongodb:
        condition: service_healthy
      tenpennynovels-redis:
        condition: service_healthy
      tenpennynovels-embeddings:
        condition: service_healthy
    networks:
      - tenpennynovels-network
    healthcheck:
      test: ["CMD", "ps", "aux", "|", "grep", "-q", "[n]ode.*embeddings-worker"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  mongodb_data:
    name: tenpennynovels_mongodb_data
  redis_data:
    name: tenpennynovels_redis_data

networks:
  tenpennynovels-network:
    name: tenpennynovels_network
    driver: bridge