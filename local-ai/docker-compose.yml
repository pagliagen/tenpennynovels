services:
  # Ollama containerizzato (fallback se non hai Ollama nativo)
  # Per usarlo: docker compose --profile ollama-docker up -d
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - ollama-docker

  mongodb:
    image: mongo:7
    ports:
      - "27030:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: local-ai
    profiles:
      - botai

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "9000:9000"
    env_file: .env
    environment:
      - IMAGE_GEN_TARGET=http://host.docker.internal:8100
    volumes:
      - ./clients.json:/app/clients.json:ro

  botai:
    build:
      context: .
      dockerfile: services/botai/Dockerfile
    expose:
      - "8080"
    env_file: .env
    depends_on:
      - mongodb
    profiles:
      - botai

  qa:
    build:
      context: .
      dockerfile: services/qa/Dockerfile
    expose:
      - "8090"
    env_file: .env
    profiles:
      - qa

  image-gen:
    build:
      context: .
      dockerfile: services/image-gen/Dockerfile
    expose:
      - "8100"
    env_file: .env
    environment:
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN:-}
      - FLUX_MODEL_ID=${FLUX_MODEL_ID:-black-forest-labs/FLUX.1-dev}
      - FLUX_STEPS=${FLUX_STEPS:-30}
    profiles:
      - image-gen

  test-ui:
    build:
      context: .
      dockerfile: tools/test-ui/Dockerfile
    ports:
      - "3100:3100"
    environment:
      - GATEWAY_URL=http://gateway:9000
      - CALLBACK_URL=http://test-ui:3100
    volumes:
      - ./clients.json:/app/clients.json:ro
    depends_on:
      - gateway
    profiles:
      - test

volumes:
  ollama_models:
  mongo_data:
