  #     # Bot AI Configuration
  #     BOT_AI_MODEL: ${BOT_AI_MODEL:-claude-3-5-sonnet-20241022}
  #     BOT_AI_MAX_TOKENS: ${BOT_AI_MAX_TOKENS:-2000}
  #     BOT_AI_TEMPERATURE: ${BOT_AI_TEMPERATURE:-0.9}
  #   ports:
  #     - "8080:8080"
  #   networks:
  #     - tenpennynovels-network
  #   depends_on:
  #     mongodb:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   healthcheck:
  #     test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 40s

# =============================================================================
# Networks
# =============================================================================
networks:
  tenpennynovels-network:
    driver: bridge
    name: tenpennynovels-network

# =============================================================================
# Volumes
# =============================================================================
volumes:
  mongodb_data:
    driver: local
    name: tenpennynovels-mongodb-data
  mongodb_config:
    driver: local
    name: tenpennynovels-mongodb-config
  redis_data:
    driver: local
    name: tenpennynovels-redis-data
  qdrant_storage:
    driver: local
    name: tenpennynovels-qdrant-storage
  cdn_storage:
    driver: local
    name: tenpennynovels-cdn-storage
