# =============================================================================
# TenPennyNovels - Docker Compose Configuration
# =============================================================================
# Services:
# - MongoDB: Database principale
# - Redis: Sessioni, caching, WebSocket adapter
# - Embeddings Worker: Unified embedding service (HTTP + Python + Bull queue)
# - Qdrant: Vector database per semantic search
# - ElasticSearch: Full-text search
# - Unified Backend: Tutti i moduli (auth, game, admin, documents, tickets, forum)
# - API Gateway: Proxy e routing

services:
  # ===========================================================================
  # MongoDB - Database principale
  # ===========================================================================
  mongodb:
    image: mongo:7.0
    container_name: tenpennynovels-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-admin123}
      MONGO_INITDB_DATABASE: tenpennynovels
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - tenpennynovels-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ===========================================================================
  # Redis - Sessioni, caching, WebSocket adapter
  # ===========================================================================
  redis:
    image: redis:7.2-alpine
    container_name: tenpennynovels-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - tenpennynovels-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ===========================================================================
  # Embeddings Worker (Unified Service)
  # - HTTP server on port 5001 (replaces embeddings-service Flask)
  # - Python subprocess for sentence-transformers
  # - Bull queue for async embedding processing
  # - Dead Letter Queue for failed jobs
  # ===========================================================================
  embeddings-worker:
    build:
      context: ./services/embeddings-worker
      dockerfile: Dockerfile
      args:
        HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN:-}  # HuggingFace token (optional)
    container_name: tenpennynovels-embeddings-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HTTP_PORT: 5001  # HTTP server for unified-backend sync calls
      PYTHON_PATH: python3  # Python interpreter for subprocess
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-admin123}@mongodb:27017/tenpennynovels?authSource=admin
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_INDEX_PREFIX: tenpennynovels
      LOG_LEVEL: info
      HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN:-}  # HuggingFace token for runtime
    ports:
      - "5001:5001"  # HTTP API for embeddings
    networks:
      - tenpennynovels-network
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s  # Increased for Python model loading

  # ===========================================================================
  # Qdrant - Vector database per semantic search
  # ===========================================================================
  qdrant:
    image: qdrant/qdrant:v1.17.0
    container_name: tenpennynovels-qdrant
    restart: unless-stopped
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC (optional)
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - tenpennynovels-network
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z localhost 6333 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ===========================================================================
  # ElasticSearch - Full-text search for hybrid search (keyword + semantic)
  # ===========================================================================
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: tenpennynovels-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - tenpennynovels-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ===========================================================================
  # Unified Backend - Tutti i moduli (auth, game, admin, documents, tickets, forum)
  # ===========================================================================
  unified-backend:
    build:
      context: ./services/unified-backend
      dockerfile: Dockerfile.dev
    container_name: tenpennynovels-unified-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001

      # MongoDB
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-admin123}@mongodb:27017/tenpennynovels?authSource=admin

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379

      # Qdrant Vector DB
      QDRANT_URL: http://qdrant:6333

      # Embeddings Service (Unified Worker)
      EMBEDDINGS_SERVICE_URL: http://embeddings-worker:5001

      # JWT Secrets
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_refresh_secret_change_in_production}

      # Frontend URLs
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4000}
      GAME_URL: ${GAME_URL:-http://localhost:4001}
      LANDING_URL: ${LANDING_URL:-http://localhost:4000}
      DOCUMENTS_URL: ${DOCUMENTS_URL:-http://localhost:4003}
      MANAGEMENT_URL: ${MANAGEMENT_URL:-http://localhost:4004}

      # Email (optional for dev)
      EMAIL_MOCK: ${EMAIL_MOCK:-true}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@tenpennynovels.test}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-1025}

      # CDN Storage
      CDN_STORAGE_PATH: /cdn-storage
      CDN_BASE_URL: http://localhost:8000/cdn
      CDN_FTP_ENABLED: "false"

      # AI Gateway (local-ai)
      AI_GATEWAY_URL: ${AI_GATEWAY_URL:-https://onomatopoeically-unforgeable-ozie.ngrok-free.dev}
      AI_GATEWAY_CLIENT_ID: ${AI_GATEWAY_CLIENT_ID:-tpn-dev}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-f4af240c291f57bcc23384bff9abcc4ce89f8257974b80e6179f88edd5f4a2f9}
      AI_GATEWAY_HMAC_SECRET: ${AI_GATEWAY_HMAC_SECRET:-}

      # Sitemap generation output directory
      SITEMAP_OUTPUT_DIR: /sitemap-output
    ports:
      - "3001:3001"
    volumes:
      # Volume mounting per hot-reload con tsx watch
      - ./services/unified-backend/src:/app/src:ro
      - ./services/unified-backend/logs:/app/logs
      - ./services/unified-backend/node_modules:/app/node_modules:ro
      - ./cdn-storage:/cdn-storage
      - ./apps/landing/public:/sitemap-output
    networks:
      - tenpennynovels-network
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      embeddings-worker:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ===========================================================================
  # API Gateway - Proxy e routing
  # ===========================================================================
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: tenpennynovels-api-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8000

      # Backend URLs
      UNIFIED_BACKEND_URL: http://unified-backend:3001
      AUTH_BACKEND_URL: http://unified-backend:3001
      GAME_BACKEND_URL: http://unified-backend:3001
      MANAGEMENT_BACKEND_URL: http://unified-backend:3001
      DOCUMENTS_BACKEND_URL: http://unified-backend:3001
      TICKETS_BACKEND_URL: http://unified-backend:3001
      FORUM_BACKEND_URL: http://unified-backend:3001

      # Frontend URLs (CORS)
      GAME_URL: ${GAME_URL:-http://localhost:4001}
      LANDING_URL: ${LANDING_URL:-http://localhost:4000}
      DOCUMENTS_URL: ${DOCUMENTS_URL:-http://localhost:4003}
      MANAGEMENT_URL: ${MANAGEMENT_URL:-http://localhost:4004}

      TRUST_PROXY: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./services/api-gateway/src:/app/src:ro
      - ./services/api-gateway/node_modules:/app/node_modules:ro
      - ./cdn-storage:/cdn-storage:ro
    networks:
      - tenpennynovels-network
    depends_on:
      unified-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# =============================================================================
# Networks
# =============================================================================
networks:
  tenpennynovels-network:
    driver: bridge
    name: tenpennynovels-network

# =============================================================================
# Volumes
# =============================================================================
volumes:
  mongodb_data:
    driver: local
    name: tenpennynovels-mongodb-data
  mongodb_config:
    driver: local
    name: tenpennynovels-mongodb-config
  redis_data:
    driver: local
    name: tenpennynovels-redis-data
  qdrant_storage:
    driver: local
    name: tenpennynovels-qdrant-storage
  elasticsearch_data:
    driver: local
    name: tenpennynovels-elasticsearch-data
